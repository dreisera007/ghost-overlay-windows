; Ghost Overlay configuration (example). Copy to GhostOverlay.ini next to GhostOverlay.ahk, edit,
; then use tray menu > Reload config. Without a GhostOverlay.ini the controller writes its own default.
; Width/Height are in DPI-independent pixels (scaled automatically for Windows display scaling).
; Target: Document = chatgpt.com in a Chrome app window with the Document Workspace extension
;         ChatGPT  = the ChatGPT app from the Microsoft Store (package OpenAI.Codex)
;         Classic  = ChatGPT Classic (package OpenAI.ChatGPT-Desktop)
; DocBrowser / DocProfile / DocUrl are only used by Target=Document.
[Overlay]
Target=Document
Width=430
Height=550
; percent, 1-100; saved by Ctrl+Alt+Up / Ctrl+Alt+Down
Opacity=30
OpacityStep=5
; floor for Ctrl+Alt+Down; 1 = barely visible, never fully invisible
MinOpacity=1
; saved by Ctrl+Alt+T
AlwaysOnTop=1
; gap from the screen corner for the default position
Margin=24
; Ctrl+Alt+G opens the window if it isn't open
LaunchIfMissing=1
LaunchTimeoutMs=25000
; hand the window back as a normal window when the controller exits
RestoreOnExit=1
WatchIntervalMs=1500
ShowTips=1
; prepare an already-open window hidden at startup so the first Ctrl+Alt+G is instant
PrewarmOnStartup=1
; blank = find chrome.exe automatically
DocBrowser=
; Chrome profile folder name, e.g. Default or Profile 1; blank = Chrome's last-used profile
DocProfile=
DocUrl=https://chatgpt.com/

; Runtime state is written below by the controller. Safe to delete.
[State]
