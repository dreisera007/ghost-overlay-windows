name: Bug report
description: Something doesn't work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Please don't include real conversation text, chat or project titles,
        account names, cookies or tokens**, in text or screenshots. Reproduce with made-up content if
        you can. Security problems: please use private vulnerability reporting instead (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Ghost Overlay version
      placeholder: "2.0.4"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Document Workspace (Chrome)
        - Native ChatGPT app
        - ChatGPT Classic
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Windows, Chrome and AutoHotkey versions
      placeholder: "Windows 11 26200, Chrome 155, AutoHotkey 2.0.23"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press Ctrl+Alt+G
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened instead
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant GhostOverlay.log lines (optional)
      description: The log contains window handles, sizes and settings only. Please read it before pasting.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report and its attachments contain no private conversation content or account details.
          required: true
